[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dvbench"
version = "0.1.0"
description = "Data, prompting, and evaluation utilities for DVBench"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
eval = [
  "nltk>=3.6",
  "rouge-score>=0.1.2",
]
bert-score = ["bert-score>=0.3.13"]
download = ["huggingface-hub>=0.23"]
providers = ["anthropic>=0.49", "google-genai>=1", "openai>=1"]

[project.scripts]
dvbench-evaluate = "dvbench.evaluation:main"
dvbench-download = "dvbench.download:main"
dvbench-infer = "dvbench.inference:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dvbench"]

[tool.hatch.build.targets.wheel.force-include]
"data/DVBench_QA.jsonl" = "dvbench/data/DVBench_QA.jsonl"

[tool.hatch.build.targets.sdist]
include = [
  "/src/dvbench",
  "/data/DVBench_QA.jsonl",
  "/data/video_url.csv",
  "/data/README.md",
  "/assets",
  "/LICENSE",
  "/DATA_LICENSE.md",
  "/README.md",
  "/pyproject.toml",
]
